services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: local-test-password
      POSTGRES_DB: polls_test
    ports:
      - "127.0.0.1::5432"
    volumes:
      - ./test-owner.sql:/docker-entrypoint-initdb.d/00-test-owner.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d polls_test"]
      interval: 1s
      timeout: 5s
      retries: 30
  auth:
    build:
      context: ..
      dockerfile: deploy/auth.Dockerfile
    environment:
      DATABASE_URL: postgres://render_owner:local-test-owner-password@database:5432/polls_test
      GOTRUE_JWT_SECRET: local-integration-test-secret-never-use-in-production
      API_EXTERNAL_URL: http://localhost:54321/auth/v1
      GOTRUE_SITE_URL: http://localhost:8081
      GOTRUE_URI_ALLOW_LIST: http://localhost:8081/**
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
    ports:
      - "127.0.0.1::9999"
    depends_on:
      database:
        condition: service_healthy
